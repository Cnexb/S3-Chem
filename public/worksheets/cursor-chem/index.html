<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomic structure quiz</title>
    <link rel="stylesheet" href="../../../css/worksheet-styles.css?v=2.1.9">
    <link rel="stylesheet" href="../ch5-shared/ch5-embed-base.css?v=2">
    <script type="module" crossorigin src="./assets/index-B9s3wOws.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-sgwgHuwE.css">
    <link rel="stylesheet" href="quiz-worksheet.css?v=8">
  </head>
  <body>
    <div id="root"></div>
<script src="https://uni-education-elearning.pages.dev/tracker/uni-tracker.js?v=8" defer></script>
<script>
(function() {
  var ANSWERS = {
    '1':  {symbol:'H',  shells:'1'},
    '2':  {symbol:'He', shells:'2'},
    '3':  {symbol:'Li', shells:'2,1'},
    '4':  {symbol:'Be', shells:'2,2'},
    '5':  {symbol:'B',  shells:'2,3'},
    '6':  {symbol:'C',  shells:'2,4'},
    '7':  {symbol:'N',  shells:'2,5'},
    '8':  {symbol:'O',  shells:'2,6'},
    '9':  {symbol:'F',  shells:'2,7'},
    '10': {symbol:'Ne', shells:'2,8'},
    '11': {symbol:'Na', shells:'2,8,1'},
    '12': {symbol:'Mg', shells:'2,8,2'},
    '13': {symbol:'Al', shells:'2,8,3'},
    '14': {symbol:'Si', shells:'2,8,4'},
    '15': {symbol:'P',  shells:'2,8,5'},
    '16': {symbol:'S',  shells:'2,8,6'},
    '17': {symbol:'Cl', shells:'2,8,7'},
    '18': {symbol:'Ar', shells:'2,8,8'},
    '19': {symbol:'K',  shells:'2,8,8,1'},
    '20': {symbol:'Ca', shells:'2,8,8,2'}
  };

  var _startTime = Date.now();
  var _captured = null;
  var _lastSymbol = '';

  document.addEventListener('input', function(e) {
    if (e.target && e.target.classList.contains('notation-tile__symbol')) {
      _lastSymbol = e.target.value || '';
    }
  }, true);

  document.addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var text = btn.textContent.trim().toLowerCase();
    if (text === 'next question' || text === '下一題' || text === 'reset all' || text === '全部重設') {
      _lastSymbol = '';
      _startTime = Date.now();
    }
  }, true);

  function captureStudentAnswer() {
    var shellBoxes = document.querySelectorAll('.shell-box');
    var shellCounts = [];
    shellBoxes.forEach(function(box) {
      var countEl = box.querySelector('.shell-box__count');
      shellCounts.push(countEl ? (parseInt(countEl.textContent) || 0) : 0);
    });

    var zEl = document.querySelector('.bohr-meta');
    var zMatch = (zEl ? zEl.textContent : '').match(/Z\s*=\s*(\d+)/);
    var z = zMatch ? zMatch[1] : 'unknown';

    var progressEl = document.querySelector('.quiz__progress');
    var pMatch = (progressEl ? progressEl.textContent : '').match(/(\d+)/);
    var current = pMatch ? pMatch[1] : '1';

    return {
      z: z,
      current: current,
      studentSymbol: _lastSymbol,
      shellCountStr: shellCounts.join(','),
      msTaken: Date.now() - _startTime
    };
  }

  document.addEventListener('pointerdown', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var text = btn.textContent.trim().toLowerCase();
    if (text === 'check answer' || text === '檢查答案') {
      _captured = captureStudentAnswer();
    }
  }, true);

  var _lastFeedback = null;

  var observer = new MutationObserver(function() {
    var ok = document.querySelector('.feedback--ok');
    var bad = document.querySelector('.feedback--bad');
    var current = ok ? 'ok' : (bad ? 'bad' : null);
    if (!current || current === _lastFeedback) return;
    _lastFeedback = current;

    if (!_captured) return;
    var ans = _captured;
    _captured = null;

    var isCorrect = (current === 'ok');
    var selectedAnswer = ans.studentSymbol + '|' + ans.shellCountStr;

    var correct = ANSWERS[ans.z];
    var correctAnswer = correct ? correct.symbol + '|' + correct.shells : null;

    try {
      window.postMessage({
        type: 'uniplus:quizAnswer',
        subject: 'CHEM',
        quizId: 'chem-ch5-atomic-structure',
        questionId: 'z' + ans.z + '-q' + ans.current,
        section: 'atomic-structure',
        difficulty: 'standard',
        stem: 'Z = ' + ans.z,
        selectedAnswer: selectedAnswer,
        selectedAnswerText: selectedAnswer,
        correctAnswer: correctAnswer,
        correctAnswerText: correctAnswer,
        isCorrect: isCorrect,
        attemptNumber: 1,
        msTaken: ans.msTaken
      }, '*');
    } catch(_) {}

    _startTime = Date.now();
    _lastFeedback = null;
  });

  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
  </body>
</html>
