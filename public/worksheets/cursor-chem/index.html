<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomic structure quiz</title>
    <link rel="stylesheet" href="../../../css/worksheet-styles.css?v=2.1.9">
    <link rel="stylesheet" href="../ch5-shared/ch5-embed-base.css?v=2">
    <script type="module" crossorigin src="./assets/index-B9s3wOws.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-sgwgHuwE.css">
    <link rel="stylesheet" href="quiz-worksheet.css?v=8">
  </head>
  <body>
    <div id="root"></div>
 <script src="https://uni-education-elearning.pages.dev/tracker/uni-tracker.js?v=8" defer></script>
<script src="https://uni-education-elearning.pages.dev/tracker/uni-tracker.js?v=8" defer></script>
<script>
(function() {
  var _startTime = Date.now();
  var _captured = null;

  function captureStudentAnswer() {
    var symbolInput = document.querySelector('.notation-tile__symbol');
    var studentSymbol = symbolInput ? symbolInput.value.trim() : '';

    var shellBoxes = document.querySelectorAll('.shell-box');
    var shellCounts = [];
    shellBoxes.forEach(function(box) {
      var countEl = box.querySelector('.shell-box__count');
      shellCounts.push(countEl ? parseInt(countEl.textContent) || 0 : 0);
    });

    var zEl = document.querySelector('.bohr-meta');
    var zText = zEl ? zEl.textContent : '';
    var zMatch = zText.match(/Z\s*=\s*(\d+)/);
    var z = zMatch ? zMatch[1] : 'unknown';

    var progressEl = document.querySelector('.quiz__progress');
    var progressText = progressEl ? progressEl.textContent : '';
    var match = progressText.match(/(\d+)/);
    var current = match ? match[1] : '1';

    return {
      z: z,
      current: current,
      studentSymbol: studentSymbol,
      shellCountStr: shellCounts.join(','),
      msTaken: Date.now() - _startTime
    };
  }

  // 監聽 Check answer button click — 喺 React 改 DOM 之前讀取
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var text = btn.textContent.trim().toLowerCase();
    if (text === 'check answer' || text === '檢查答案') {
      _captured = captureStudentAnswer();
    }
  }, true); // capture phase，先於 React 處理

  // feedback 出現後 dispatch
  var observer = new MutationObserver(function() {
    var ok = document.querySelector('.feedback--ok');
    var bad = document.querySelector('.feedback--bad');
    if (!ok && !bad) return;
    if (!_captured) return;

    var ans = _captured;
    _captured = null;

    var isCorrect = !!ok;
    var selectedAnswer = ans.studentSymbol + '|' + ans.shellCountStr;

    try {
      window.postMessage({
        type: 'uniplus:quizAnswer',
        subject: 'CHEM',
        quizId: 'chem-ch5-atomic-structure',
        questionId: 'z' + ans.z + '-q' + ans.current,
        section: 'atomic-structure',
        difficulty: 'standard',
        stem: 'Z = ' + ans.z,
        selectedAnswer: selectedAnswer,
        selectedAnswerText: selectedAnswer,
        correctAnswer: null,
        correctAnswerText: null,
        isCorrect: isCorrect,
        attemptNumber: 1,
        msTaken: ans.msTaken
      }, '*');
    } catch(_) {}

    _startTime = Date.now();
  });

  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
  </body>
</html>
