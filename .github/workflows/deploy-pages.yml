# Publishes the built site to GitHub Pages when you push to main.
# After the first successful run, your site will be at:
#   https://unipluseducationact-ctrl.github.io/S3-Chem/
# Old URL https://…/S3-CH5-table/ is preserved via pages-redirect/ (see pages-redirect/README.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Re-run after repo rename so Pages serves the latest dist/, not a stale deployment.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Wait for in-flight deploys instead of cancelling (avoids "Deployment failed, try again later").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Verify build includes current app shell
        run: |
          grep -q 'flashcards-page' dist/index.html
          grep -q 'worksheet-hub' dist/index.html
          grep -q 'data-page="flashcards"' dist/index.html
          test -f dist/public/notes/topic-01-planet-earth.pdf
          grep -q 'notes-pdf-frame' dist/index.html
          grep -q 'summary-hub' dist/index.html
          grep -q 'summary-panel-topic-2' dist/index.html
          test -f dist/public/summary/topic-02/01-elements-and-isotopes.png
          test -f dist/public/summary/topic-02/01-elements-and-isotopes.webp
          test -f dist/public/tools/chem-catch/index.html
          test -f dist/public/worksheets/cursor-chem/index.html
          test -f dist/public/worksheets/ch2-microscopic-world-1/worksheet.html
          test -f dist/public/worksheets/ch2-microscopic-world-1/pdf-question-bank.json
          grep -q 'data-page="quiz"' dist/index.html
          test -f dist/public/quiz/microscopic-world-i/quiz.html
          test -f dist/public/quiz/microscopic-world-i/js/quizApp.js
          test -f dist/public/worksheets/topic-3-metals-exercise/quiz.html
          grep -q 'topic-3-metals-exercise' dist/index.html
          test -f dist/public/tools/flame-test-fireworks/assets/backgrounds/city-skyline-3.jpg
          test -f dist/public/three.min.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url || steps.deployment_retry3.outputs.page_url || steps.deployment_retry4.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait 45s before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait 60s before retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait 90s before retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (attempt 4)
        id: deployment_retry3
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait 120s before retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry2.outcome == 'failure' && steps.deployment_retry3.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (attempt 5)
        id: deployment_retry4
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' && steps.deployment_retry2.outcome == 'failure' && steps.deployment_retry3.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Fail if all deploy attempts failed
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment_retry.outcome == 'failure' &&
          steps.deployment_retry2.outcome == 'failure' &&
          steps.deployment_retry3.outcome == 'failure' &&
          steps.deployment_retry4.outcome == 'failure'
        run: |
          echo "GitHub Pages deploy failed after 5 attempts (transient API error or conflicting Pages source)."
          echo "Check Settings → Pages uses GitHub Actions only (not Deploy from branch /dist)."
          exit 1
